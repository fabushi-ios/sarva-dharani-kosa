name: Deploy Production (正式版) to Cloudflare Pages

on:
  push:
    branches:
      - production
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Cloudflare Pages 项目名称 (CF_PAGES_PROJECT)'
        required: false
        default: 'sarva-dharani-kosa'

jobs:
  deploy-cloudflare-prod:
    name: Build & Deploy Production (正式版) to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify before deploy (type-check, all tests incl. citation check & search invariants)
        run: |
          npx tsc --noEmit -p .
          npx vitest run

      - name: Build & Deploy Production Bundle to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ github.event.inputs.project_name || 'sarva-dharani-kosa' }}
        run: bash scripts/deploy-cf-prod.sh
