name: Hugging Face 48h Auto Keep-Alive

on:
  schedule:
    # Runs automatically every 30 minutes (48 times/day) to prevent HF Space hibernation
    # for BOTH the MITRA-Qwen3.5 Buddhist Sutra Q&A Space and 48kHz Neural VITS TTS Space
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hf-keepalive.yml'
      - 'scripts/hf-keepalive.mjs'

jobs:
  keepalive:
    name: Ping & Wake Hugging Face Buddhist Q&A Space + Neural TTS API + Static Space
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute Hugging Face Buddhist Q&A + Neural TTS Space Keep-Alive
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: bhrum108/sarva-dharani-kosa
          HF_TTS_SPACE_ID: bhrum108/sarva-dharani-kosa-tts-api
          HF_QA_SPACE_ID: bhrum108/sarva-dharani-kosa-buddhist-qa
          HF_MODEL_ID: bhrum108/sarva-dharani-kosa-tts
          HF_SPACE_LIVE_URL: https://bhrum108-sarva-dharani-kosa.static.hf.space
          HF_TTS_API_URL: https://bhrum108-sarva-dharani-kosa-tts-api.hf.space
        run: node scripts/hf-keepalive.mjs
