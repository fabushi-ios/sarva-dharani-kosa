name: Deploy Cloud Corpus & Static Space to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-hf:
    name: Build & Deploy Cloud Corpus Shards + Static Space to Hugging Face
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          pip install -q huggingface_hub

      - name: Build Cloud Corpus Shards & Production Bundle and Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/deploy-hf-and-cf.sh
