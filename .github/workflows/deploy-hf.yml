name: Deploy Staging (测试版) to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-hf:
    name: Build & Deploy Staging (测试版) + 48kHz Neural TTS API to Hugging Face
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          pip install -U -q "huggingface_hub>=0.26.0"

      - name: Deploy Staging Static Space, 48kHz Neural TTS API & Cloud Corpus to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SKIP_CLOUDFLARE: '1'
        run: bash scripts/deploy-hf-and-cf.sh --hf-only
