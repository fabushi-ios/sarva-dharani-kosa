<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>梵音宝典 · Sarva-Dhāraṇī-Kośa | 梵文陀罗尼权威数据库与 48kHz 神经声韵系统</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Siddham&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-siddham: 'Noto Sans Siddham', 'Noto Sans Devanagari', sans-serif;
        --font-deva: 'Noto Sans Devanagari', sans-serif;
        --font-serif-cn: 'Noto Serif SC', 'Songti SC', serif;
      }
      body {
        background-color: #0c0a09;
        color: #f5f5f4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Serif SC', sans-serif;
      }
      .font-siddham {
        font-family: var(--font-siddham);
      }
      .font-deva {
        font-family: var(--font-deva);
      }
      .font-serif-cn {
        font-family: var(--font-serif-cn);
      }
      @keyframes pulseGlow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.45);
        }
        50% {
          box-shadow: 0 0 18px 4px rgba(245, 158, 11, 0.75);
        }
      }
      .syllable-active-glow {
        animation: pulseGlow 1.1s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="bg-stone-950 text-stone-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
